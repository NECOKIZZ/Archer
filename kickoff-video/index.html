<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Project entry: mounts the Kickoff spot so `hyperframes check .` and Studio see it.
         Render directly with: npx hyperframes render -c compositions/video.html -o renders/video.mp4 -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div
        id="video"
        class="clip"
        data-composition-id="video"
        data-composition-src="compositions/video.html"
        data-start="0"
        data-duration="60"
        data-track-index="0"
        style="position: absolute; inset: 0"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
